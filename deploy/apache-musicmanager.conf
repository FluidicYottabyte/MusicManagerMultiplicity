# Requires: a2enmod proxy proxy_http headers ssl
#
# Reverse-proxies all traffic to the Next.js process on 127.0.0.1:3000.
# LimitRequestBody matches the app's own upload cap (200MB) - keep these
# in sync (see next.config.js's experimental.serverActions.bodySizeLimit
# and src/app/upload/actions.ts).

<VirtualHost *:80>
    ServerName music.example.com
    Redirect permanent / https://music.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName music.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/music.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/music.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https"

    # Uploads + long audio-stream responses need generous limits/timeouts.
    LimitRequestBody 209715200
    ProxyTimeout 300

    ErrorLog  ${APACHE_LOG_DIR}/musicmanager-error.log
    CustomLog ${APACHE_LOG_DIR}/musicmanager-access.log combined
</VirtualHost>
